<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to San BOT...</title>
    <script>
        // Redirect immediately to index.html preserving query parameters & hash
        (function () {
            var target = 'index.html' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 38px;
            height: 38px;
            border: 3.5px solid #bfdbfe;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div>
        <div class="loader"></div>
        <p style="font-weight: 700; font-size: 1.05rem; margin: 0 0 0.5rem 0;">กำลังเปลี่ยนเส้นทางไปยังหน้าหลัก San BOT...</p>
        <p style="font-size: 0.85rem; color: #64748b; margin: 0;">
            หากระบบไม่เปลี่ยนหน้าอัตโนมัติ <a href="index.html"
                style="color: #2563eb; font-weight: 700; text-decoration: underline;">คลิกที่นี่เพื่อเข้าสู่ระบบ</a>
        </p>
    </div>
</body>

</html>
