<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>San BOT - กำลังเข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl text-white">
    <div class="w-16 h-16 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <h2 class="text-2xl font-bold mb-2">San BOT</h2>
    <h3 id="statusText" class="text-blue-200 text-sm font-medium mb-4">กำลังโหลด...</h3>
    <button id="retryBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-lg" style="display: none;">🔄 ลองอีกครั้ง</button>
    <div id="dev-mode-message" class="text-amber-400 text-xs mt-3"></div>

    <!-- Out-of-LINE instructions -->
    <div id="out-of-line-panel" style="display:none;" class="mt-6 pt-6 border-t border-white/10 text-center">
      <p class="text-xs text-gray-300 max-w-sm mx-auto mb-4 leading-relaxed">กรุณาเปิดลิงก์นี้จากแอป LINE บนมือถือเพื่อใช้งานระบบเต็มรูปแบบ</p>
      <div class="flex gap-2 justify-center mb-4">
        <button id="copyUrlBtn" onclick="copyLiffUrl()" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold rounded-xl transition shadow">📋 คัดลอกลิงก์</button>
        <button id="showQrBtn" onclick="toggleQr()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-xl transition shadow">🔳 แสดง QR</button>
      </div>
      <div id="qrHolder" class="text-center">
        <img id="liff-qr" src="" alt="LIFF QR" class="mx-auto border-4 border-white rounded-2xl shadow-xl max-w-[180px]" style="display:none;" />
      </div>
    </div>
  </div>


  <script>
    const liffId = (typeof CONFIG !== 'undefined' && CONFIG.LIFF_ID) ? CONFIG.LIFF_ID : "2004593216-XbA9wj26";
    const scriptUrl = (typeof CONFIG !== 'undefined' && CONFIG.GAS_URL) ? CONFIG.GAS_URL : "https://script.google.com/macros/s/AKfycbyh2g8Qnbfvv70-sYVM7VRMzkfivB6BqLtnM3ajq1s248zbfECpJvcS8YTDONE4MbiY/exec";

    async function init() {
      try {
        const statusEl = document.getElementById("statusText");
        if (statusEl) statusEl.textContent = "กำลังเข้าสู่ระบบ LINE...";

        // init LIFF
        await liff.init({ liffId, withLoginOnExternalBrowser: true });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        if (statusEl) statusEl.textContent = "กำลังตรวจสอบสิทธิ์...";

        // --- หา UID ---
        let uid = sessionStorage.getItem("line_uid");

        if (!uid) {
          if (liff.isInClient()) {
            const profile = await liff.getProfile();
            uid = profile.userId;
            sessionStorage.setItem("line_uid", uid);
            localStorage.setItem("line_uid", uid); // dev mode
          } else {
            uid = localStorage.getItem("line_uid");
            if (!uid) {
              const outPanel = document.getElementById("out-of-line-panel");
              const devMsg = document.getElementById("dev-mode-message");
              if (devMsg) devMsg.textContent = "โหมดทดสอบ: ยังไม่มี UID กรุณาเปิดจากแอป LINE อย่างน้อยหนึ่งครั้ง";
              if (outPanel) outPanel.style.display = 'block';
              return;
            }
          }
        }

        // --- Call Check Auth API ---
        const authRes = await checkUserAuth(uid, "");
        console.log("API Auth Result:", authRes);

        if (authRes && authRes.success && authRes.access) {
          window.location.href = "index.html";
        } else {
          window.location.href = "register.html";
        }

      } catch (err) {
        console.error("Error:", err);
        const statusEl = document.getElementById("statusText");
        if (statusEl) statusEl.textContent = "❌ ไม่สามารถโหลดข้อมูลได้";
        const retryBtn = document.getElementById("retryBtn");
        if (retryBtn) retryBtn.style.display = "inline-block";
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    // ปุ่ม "ลองอีกครั้ง"
    document.getElementById("retryBtn").addEventListener("click", () => {
      location.reload();
    });

    // ปุ่มคัดลอก URL LIFF
    function copyLiffUrl() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(()=>{
          alert('คัดลอกลิงก์เรียบร้อย');
        }).catch(()=>{
          prompt('คัดลอกลิงก์นี้:', url);
        });
      } else {
        prompt('คัดลอกลิงก์นี้:', url);
      }
    }

    // ปุ่มแสดง/ซ่อน QR Code ของ LIFF URL
    function toggleQr() {
      const img = document.getElementById('liff-qr');
      if (!img) return;
      if (img.style.display === 'block') {
        img.style.display = 'none';
      } else {
        img.style.display = 'block';
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(window.location.href);
      }
    }

    window.onload = init;
  </script>
</body>

</html>
